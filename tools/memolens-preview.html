<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>MemoLens demo preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:960px;height:540px;background:#091712;color:#f4f0df;font-family:Arial,sans-serif}
main{height:540px;display:grid;grid-template-columns:1fr 240px;gap:50px;padding:38px 60px}
.copy{display:flex;flex-direction:column;justify-content:center}
h1{font-size:44px;letter-spacing:-1.5px;margin:0 0 24px;color:#c5efb2}
h2{font-size:29px;margin:0 0 18px}
p{font-size:21px;line-height:1.5;margin:0 0 36px}
.watch{font-size:20px;color:#e8b777;margin-top:18px}.note{font-size:13px;color:#bdd0c1;margin:0}
img{height:464px;width:232px;object-fit:contain;border-radius:20px}
</style>
<main>
<section class="copy"><h1>MemoLens</h1><h2>A photo journal</h2>
<p>Save photos with captions, moods, tags and voice notes.</p>
<div class="watch">▶ Watch the demo</div><p class="note">App preview with sample entries</p></section>
<img src="../assets/after-hours/memolens-app.png" alt="MemoLens sample photo entries">
</main>
</html>
